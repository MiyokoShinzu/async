<!DOCTYPE html>

<html lang="en">

<head></head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>Login | ETS-Async</title>


<!-- Bootstrap 5 -->

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>


<style>

    :root {

        --academic-blue: #0B4F8A;

        --academic-blue-dark: #083B66;

        --academic-blue-light: #EAF3FA;

        --border-color: #DEE2E6;

        --text-muted: #6C757D;

    }


    body {

        font-family:
            'Segoe UI',
            Tahoma,
            Geneva,
            Verdana,
            sans-serif;

        min-height: 100vh;

        margin: 0;

        display: flex;

        align-items: center;

        justify-content: center;

        background:
            linear-gradient(
                135deg,
                #F7F9FB,
                #EAF3FA
            );

    }


    .login-card {

        width: 100%;

        max-width: 400px;

        background: #FFFFFF;

        border:
            1px solid
            var(--border-color);

        border-radius: 12px;

        padding: 35px;

        box-shadow:
            0 10px 35px
            rgba(0, 0, 0, 0.08);

    }


    .logo {

        width: 65px;

        height: 65px;

        border-radius: 50%;

        background:
            var(--academic-blue-light);

        color:
            var(--academic-blue);

        display: flex;

        align-items: center;

        justify-content: center;

        margin:
            0 auto 20px;

        font-size: 28px;

    }


    h1 {

        color:
            var(--academic-blue-dark);

        font-size: 28px;

        font-weight: 700;

        text-align: center;

        margin-bottom: 5px;

    }


    .subtitle {

        color:
            var(--text-muted);

        text-align: center;

        margin-bottom: 30px;

    }


    .form-label {

        font-weight: 600;

        color:
            var(--academic-blue-dark);

    }


    .form-control {

        height: 48px;

        border-radius: 6px;

    }


    .form-control:focus {

        border-color:
            var(--academic-blue);

        box-shadow:
            0 0 0 0.2rem
            rgba(11, 79, 138, 0.15);

    }


    .login-button {

        width: 100%;

        height: 48px;

        border: none;

        border-radius: 6px;

        background:
            linear-gradient(
                135deg,
                #0B4F8A,
                #083B66
            );

        color: #FFFFFF;

        font-weight: 600;

        font-size: 16px;

    }


    .login-button:hover {

        transform:
            translateY(-1px);

        background:
            var(--academic-blue-dark);

    }


    .login-button:disabled {

        opacity: 0.7;

    }


    .register {

        text-align: center;

        margin-top: 22px;

        color:
            var(--text-muted);

        font-size: 14px;

    }


    .register a {

        color:
            var(--academic-blue);

        font-weight: 600;

        text-decoration: none;

    }


    .register a:hover {

        text-decoration: underline;

    }


    #loginMessage {

        display: none;

        font-size: 14px;

    }


    .password-wrapper {

        position: relative;

    }


    .password-wrapper .form-control {

        padding-right: 65px;

    }


    .show-password {

        position: absolute;

        right: 10px;

        top: 50%;

        transform:
            translateY(-50%);

        border: none;

        background: transparent;

        color:
            var(--text-muted);

        font-size: 13px;

    }


    .show-password:hover {

        color:
            var(--academic-blue);

    }

</style>


</head>

<body>

<div class="login-card">

<!-- LOGO -->

<div class="logo">

    🔐

</div>


<!-- TITLE -->

<h1>

    Login

</h1>


<p class="subtitle">

    ETS-Async Learning Portal

</p>



<!-- MESSAGE -->

<div
    id="loginMessage"
    class="alert"
></div>



<!-- FORM -->

<form id="loginForm">


    <!-- USERNAME -->

    <div class="mb-3">

        <label
            for="username"
            class="form-label"
        >

            Username

        </label>


        <input
            type="text"
            class="form-control"
            id="username"
            name="username"
            placeholder="Enter username"
            autocomplete="username"
            required
        >

    </div>



    <!-- PASSWORD -->

    <div class="mb-4">

        <label
            for="password"
            class="form-label"
        >

            Password

        </label>


        <div class="password-wrapper">

            <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >


            <button
                type="button"
                class="show-password"
                id="togglePassword"
            >

                Show

            </button>

        </div>

    </div>



    <!-- LOGIN BUTTON -->

    <button
        type="submit"
        class="login-button"
        id="loginButton"
    >

        Login

    </button>


</form>



<!-- REGISTER -->

<div class="register">

    Don't have an account?

    <a href="register.html">

        Register

    </a>

</div>


</div>

<script>


    /* =====================================
       API
    ====================================== */

    const LOGIN_API = "login.php";



    /* =====================================
       PASSWORD SHOW / HIDE
    ====================================== */

    const password =
        document.getElementById(
            "password"
        );


    const togglePassword =
        document.getElementById(
            "togglePassword"
        );


    togglePassword.addEventListener(
        "click",
        function () {

            if (
                password.type === "password"
            ) {

                password.type = "text";

                togglePassword.textContent =
                    "Hide";

            }

            else {

                password.type =
                    "password";

                togglePassword.textContent =
                    "Show";

            }

        }
    );



    /* =====================================
       MESSAGE
    ====================================== */

    function showMessage(
        message,
        type
    ) {

        const messageBox =
            document.getElementById(
                "loginMessage"
            );


        messageBox.className =
            "alert alert-" + type;


        messageBox.textContent =
            message;


        messageBox.style.display =
            "block";

    }



    /* =====================================
       LOGIN
    ====================================== */

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const username =
                    document
                        .getElementById(
                            "username"
                        )
                        .value
                        .trim();


                const passwordValue =
                    document
                        .getElementById(
                            "password"
                        )
                        .value;


                const button =
                    document.getElementById(
                        "loginButton"
                    );


                if (
                    username === "" ||
                    passwordValue === ""
                ) {

                    showMessage(
                        "Please enter your username and password.",
                        "warning"
                    );

                    return;

                }


                button.disabled = true;

                button.textContent =
                    "Logging in...";


                try {


                    const response =
                        await fetch(
                            LOGIN_API,
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        username:
                                            username,

                                        password:
                                            passwordValue

                                    })

                            }
                        );


                    const data =
                        await response.json();


                    if (
                        response.ok &&
                        data.success
                    ) {


                        showMessage(
                            data.message ||
                            "Login successful.",
                            "success"
                        );


                        setTimeout(
                            function () {

                                window.location.href =
                                    "../dashboard.html";

                            },
                            700
                        );


                    }

                    else {


                        showMessage(
                            data.message ||
                            "Invalid username or password.",
                            "danger"
                        );


                        button.disabled =
                            false;


                        button.textContent =
                            "Login";

                    }


                }

                catch (error) {


                    console.error(
                        "Login error:",
                        error
                    );


                    showMessage(
                        "Unable to connect to the server.",
                        "danger"
                    );


                    button.disabled =
                        false;


                    button.textContent =
                        "Login";

                }

            }
        );

</script>

</body>

</html>
